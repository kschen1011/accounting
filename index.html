<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="半吊子帳本">
<title>🍪 半吊子廚房 · 收支帳本 v3.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --cream: #FAF7F2;
  --paper: #F3EEE5;
  --ink: #1C1C1A;
  --ink2: #5A5751;
  --ink3: #9B9690;
  --border: #DDD8CF;
  --green: #5A9B30;
  --green-t: #3A6B1E;
  --red: #D94133;
  --red-t: #A8271F;
  --gold: #C49A2A;
  --orange: #E05A10;
  --orange-t: #C2440A;
  --blue-t: #1A4F9E;
  --header-h: 56px;
  --nav-h: 48px;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--cream); font-family: 'Noto Sans TC', sans-serif; color: var(--ink); font-size: 14px; }
.hidden { display: none !important; }
input, select, textarea, button { font-family: inherit; font-size: inherit; }
button { cursor: pointer; border: none; background: none; }

/* ── LOCK SCREEN ───────────────────────────────────────── */
#lockScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1C1C1A 0%, #3A2E26 50%, #1C1C1A 100%);
  padding: 24px;
}
.lock-card {
  background: var(--cream);
  border-radius: 20px;
  padding: 40px 36px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 24px 64px rgba(0,0,0,.4);
  text-align: center;
}
.lock-brand { font-size: 40px; margin-bottom: 8px; }
.lock-title { font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.lock-sub { font-size: 12px; color: var(--ink3); margin-bottom: 32px; }
.lock-label { display: block; text-align: left; font-size: 12px; color: var(--ink3); margin-bottom: 6px; font-weight: 500; }
.lock-input-wrap { position: relative; margin-bottom: 16px; }
.lock-input {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 42px 12px 14px;
  background: #fff;
  color: var(--ink);
  font-size: 15px;
  outline: none;
  transition: border-color .2s;
}
.lock-input:focus { border-color: var(--orange); }
.toggle-pw {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink3);
  font-size: 16px;
  padding: 4px;
}
.lock-btn {
  width: 100%;
  background: var(--ink);
  color: #fff;
  border-radius: var(--radius);
  padding: 13px;
  font-size: 15px;
  font-weight: 500;
  transition: background .2s;
  margin-top: 4px;
}
.lock-btn:hover { background: var(--orange); }
.lock-err { font-size: 13px; color: var(--red); margin-top: 10px; min-height: 18px; }
.lock-hint { font-size: 12px; color: var(--ink3); margin-top: 20px; line-height: 1.6; }

/* ── MAIN APP ─────────────────────────────────────────── */
#app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

header {
  height: var(--header-h);
  background: var(--ink);
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  flex-shrink: 0;
  z-index: 100;
}
.header-brand { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: 600; flex: 1; }
.header-brand span { font-size: 12px; color: rgba(255,255,255,.5); font-family: 'Noto Sans TC'; font-weight: 300; margin-left: 6px; }
.sync-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
  transition: background .3s;
}
.sync-dot.saving { background: var(--gold); animation: pulse .8s infinite; }
.sync-dot.error { background: var(--red); }
.sync-dot.offline { background: var(--ink3); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.header-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,.7);
  font-size: 16px;
  transition: background .2s, color .2s;
}
.header-btn:hover { background: rgba(255,255,255,.1); color: #fff; }

nav.tabs {
  height: var(--nav-h);
  background: var(--paper);
  border-bottom: 1px solid var(--border);
  display: flex;
  overflow-x: auto;
  flex-shrink: 0;
  scrollbar-width: none;
}
nav.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0;
  padding: 0 14px;
  font-size: 13px;
  color: var(--ink3);
  border-bottom: 3px solid transparent;
  transition: color .2s, border-color .2s;
  white-space: nowrap;
  height: 100%;
}
.tab-btn.active { color: var(--ink); border-bottom-color: var(--gold); font-weight: 500; }
.tab-btn:hover:not(.active) { color: var(--ink2); }

main { flex: 1; overflow-y: auto; overflow-x: hidden; }
.tab-panel { display: none; padding: 20px 16px 80px; }
.tab-panel.active { display: block; }

/* ── CARDS & SECTIONS ─────────────────────────────────── */
.card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}
.card-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.section-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 8px;
}

/* ── FORM ELEMENTS ────────────────────────────────────── */
.form-row { display: grid; gap: 12px; margin-bottom: 12px; }
.form-row.cols2 { grid-template-columns: 1fr 1fr; }
.form-row.cols3 { grid-template-columns: 1fr 1fr 1fr; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 12px; color: var(--ink3); font-weight: 500; }
.form-input, .form-select, .form-textarea {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 9px 11px;
  background: var(--cream);
  color: var(--ink);
  width: 100%;
  outline: none;
  transition: border-color .2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--orange); background: #fff; }
.form-textarea { resize: vertical; min-height: 80px; }

/* TYPE SELECTOR */
.type-select { display: flex; gap: 8px; margin-bottom: 12px; }
.type-btn {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: 2px solid var(--border);
  font-size: 14px;
  font-weight: 500;
  transition: all .2s;
}
.type-btn.income.active { background: var(--green); border-color: var(--green); color: #fff; }
.type-btn.expense.active { background: var(--red); border-color: var(--red); color: #fff; }
.type-btn:not(.active) { color: var(--ink3); background: var(--cream); }

/* SUBMIT BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  transition: all .2s;
  cursor: pointer;
  border: none;
}
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover { background: var(--ink2); }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: var(--green-t); }
.btn-orange { background: var(--orange); color: #fff; }
.btn-orange:hover { background: var(--orange-t); }
.btn-gold { background: var(--gold); color: #fff; }
.btn-red { background: var(--red); color: #fff; }
.btn-red:hover { background: var(--red-t); }
.btn-ghost { background: var(--paper); color: var(--ink2); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--ink3); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-full { width: 100%; justify-content: center; }

/* ── STAT CARDS ───────────────────────────────────────── */
.stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 12px; text-align: center; }
.stat-label { font-size: 11px; color: var(--ink3); margin-bottom: 6px; }
.stat-val { font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 600; }
.stat-val.income { color: var(--green); }
.stat-val.expense { color: var(--red); }
.stat-val.surplus { color: var(--ink); }
.stat-val.surplus.neg { color: var(--red); }

/* ── CHARTS ───────────────────────────────────────────── */
.chart-wrap { position: relative; height: 200px; margin-bottom: 8px; }
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.donut-wrap { position: relative; height: 160px; }

/* ── TABLES ───────────────────────────────────────────── */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: var(--paper); padding: 8px 10px; text-align: left; font-weight: 500; color: var(--ink2); font-size: 12px; white-space: nowrap; }
td { padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: var(--cream); }
.td-income { color: var(--green); font-family: 'Noto Serif TC', serif; }
.td-expense { color: var(--red); font-family: 'Noto Serif TC', serif; }
.td-surplus { font-family: 'Noto Serif TC', serif; }
.td-surplus.neg { color: var(--red); }
.td-actions { white-space: nowrap; }
.icon-btn {
  width: 28px; height: 28px;
  border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: background .15s;
  margin-left: 4px;
}
.icon-btn:hover { background: var(--paper); }
.icon-btn.del:hover { background: #fde8e6; color: var(--red); }

/* INLINE EDIT ROW */
.edit-row td { background: #FFF8F0; }
.edit-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 0; }

/* ── POS SYNC ─────────────────────────────────────────── */
.quick-dates { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.quick-btn {
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 12px;
  color: var(--ink2);
  background: #fff;
  transition: all .15s;
}
.quick-btn:hover, .quick-btn.active { background: var(--orange); color: #fff; border-color: var(--orange); }
.pos-preview { margin-top: 14px; }
.pos-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
.pos-check { width: 18px; height: 18px; accent-color: var(--orange); }
.pos-date { font-weight: 500; font-size: 13px; min-width: 80px; }
.pos-desc { flex: 1; color: var(--ink2); font-size: 12px; }
.pos-amt { font-family: 'Noto Serif TC', serif; font-size: 14px; font-weight: 600; color: var(--green); }
.pos-tag { font-size: 10px; background: var(--paper); color: var(--ink3); padding: 2px 6px; border-radius: 4px; }
.pos-tag.done { background: #e8f4e0; color: var(--green); }


.ai-label { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--blue-t); background: #e8f0ff; padding: 3px 8px; border-radius: 4px; margin-bottom: 10px; }
.ai-preview { margin-top: 14px; }
.ai-item { background: var(--paper); border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.ai-item-type { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.ai-item-type.income { background: #e8f4e0; color: var(--green); }
.ai-item-type.expense { background: #fde8e6; color: var(--red); }
.ai-item-info { flex: 1; }
.ai-item-desc { font-size: 13px; font-weight: 500; }
.ai-item-cat { font-size: 11px; color: var(--ink3); margin-top: 2px; }
.ai-item-amt { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: 600; }

/* ── INGREDIENT BLOCK ─────────────────────────────────── */
.ing-block { background: var(--paper); border-radius: 8px; padding: 14px; margin-top: 8px; }
.ing-block .section-label { margin-bottom: 10px; }

/* ── FILTER BAR ───────────────────────────────────────── */
.filter-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }

/* ── P&L ──────────────────────────────────────────────── */
.pl-section { margin-bottom: 8px; }
.pl-row { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 6px; }
.pl-row:nth-child(even) { background: var(--cream); }
.pl-label { color: var(--ink2); }
.pl-label.sub { color: var(--ink3); padding-left: 16px; font-size: 13px; }
.pl-label.group { font-weight: 600; color: var(--ink); }
.pl-amt { font-family: 'Noto Serif TC', serif; font-weight: 600; }
.pl-row.total { background: var(--ink); border-radius: 8px; margin-top: 8px; }
.pl-row.total .pl-label { color: rgba(255,255,255,.8); font-weight: 600; }
.pl-row.total .pl-amt { color: #fff; font-size: 18px; }
.pl-row.total .pl-amt.neg { color: #f8a09a; }

/* ── ANALYTICS SUB-TABS ───────────────────────────────── */
.sub-tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--paper); border-radius: var(--radius); padding: 4px; }
.sub-tab {
  flex: 1;
  padding: 7px 4px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink3);
  text-align: center;
  transition: all .2s;
}
.sub-tab.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }

/* ── TOAST ────────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 9999;
  opacity: 0;
  transition: all .3s;
  white-space: nowrap;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.success { background: var(--green); }
#toast.error { background: var(--red); }

/* ── MODAL ────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 500;
  display: flex; align-items: flex-end;
}
.modal-sheet {
  background: var(--cream);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px 20px 40px;
}
.modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
.modal-title { font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 600; margin-bottom: 20px; }
.modal-section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.modal-section:last-child { border-bottom: none; }
.modal-section-title { font-size: 12px; font-weight: 600; color: var(--ink3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }

/* ── LOADING ──────────────────────────────────────────── */
.loading { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 24px; color: var(--ink3); font-size: 13px; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--orange); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.empty { text-align: center; padding: 40px 20px; color: var(--ink3); }
.empty-icon { font-size: 36px; margin-bottom: 8px; }

/* ── ANALYTICS YEAR/MONTH SELECTORS ──────────────────── */
.selectors-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.selectors-row select { flex: 1; min-width: 100px; }


/* ── MATERIAL LIBRARY ─────────────────────────────────── */
.mat-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-top: 1px solid var(--border); }
.mat-name { flex: 1; font-weight: 500; }
.mat-unit { font-size: 12px; color: var(--ink3); background: var(--paper); padding: 2px 8px; border-radius: 4px; }

/* ── RESPONSIVE ───────────────────────────────────────── */
@media (min-width: 600px) {
  .stats-row { grid-template-columns: repeat(3, 1fr); }
  .form-row.cols2 { grid-template-columns: 1fr 1fr; }
  .filter-bar { grid-template-columns: repeat(4, 1fr); }
  nav.tabs .tab-btn { padding: 0 20px; font-size: 14px; }
}

/* ── SETUP SCREEN ─────────────────────────────────────── */
.setup-steps { text-align: left; margin-top: 16px; }
.setup-step { display: flex; gap: 12px; margin-bottom: 14px; }
.step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--orange); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
.step-text { font-size: 13px; color: var(--ink2); line-height: 1.6; }

.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
.badge-pos { background: #fff3e0; color: var(--orange); }
.badge-ai { background: #e8f0ff; color: var(--blue-t); }
.badge-sync { background: #e8f4e0; color: var(--green); }
</style>
</head>
<body>

<!-- ── LOCK SCREEN ─────────────────────────────────────── -->
<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-brand">🍪</div>
    <div class="lock-title">半吊子廚房</div>
    <div class="lock-sub">收支帳本系統 v3.0</div>

    <!-- SET PASSWORD (first time) -->
    <div id="setPwView">
      <div class="setup-steps">
        <div class="setup-step">
          <div class="step-num">1</div>
          <div class="step-text">第一次使用，請設定您的登入密碼</div>
        </div>
      </div>
      <label class="lock-label">設定密碼</label>
      <div class="lock-input-wrap">
        <input type="password" id="newPw1" class="lock-input" placeholder="請輸入密碼（至少 4 位）" autocomplete="new-password">
        <button class="toggle-pw" onclick="togglePw('newPw1',this)">👁</button>
      </div>
      <label class="lock-label">確認密碼</label>
      <div class="lock-input-wrap">
        <input type="password" id="newPw2" class="lock-input" placeholder="再輸入一次" autocomplete="new-password">
        <button class="toggle-pw" onclick="togglePw('newPw2',this)">👁</button>
      </div>
      <button class="lock-btn" onclick="doSetPassword()">設定並進入系統</button>
      <div id="setPwErr" class="lock-err"></div>
    </div>

    <!-- LOGIN -->
    <div id="loginView" class="hidden">
      <label class="lock-label">請輸入密碼</label>
      <div class="lock-input-wrap">
        <input type="password" id="loginPw" class="lock-input" placeholder="密碼" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') doLogin()">
        <button class="toggle-pw" onclick="togglePw('loginPw',this)">👁</button>
      </div>
      <button class="lock-btn" onclick="doLogin()">進入系統</button>
      <div id="loginErr" class="lock-err"></div>
      <div class="lock-hint">忘記密碼？請清除瀏覽器 localStorage 後重新設定。</div>
    </div>
  </div>
</div>

<!-- ── MAIN APP ─────────────────────────────────────────── -->
<div id="app" class="hidden">

  <header>
    <div class="header-brand">🍪 半吊子廚房 <span>帳本</span></div>
    <div class="sync-dot" id="syncDot" title="同步狀態"></div>
    <button class="header-btn" onclick="openSettings()" title="設定">⚙️</button>
    <button class="header-btn" onclick="lockApp()" title="鎖定">🔒</button>
  </header>

  <nav class="tabs" id="mainTabs">
    <button class="tab-btn active" data-tab="analytics">📊 數據</button>
    <button class="tab-btn" data-tab="pos">🔄 POS</button>
    <button class="tab-btn" data-tab="materials">📦 材料庫</button>
    <button class="tab-btn" data-tab="manual">✏️ 記帳</button>
    <button class="tab-btn" data-tab="ledger">📋 明細</button>
    <button class="tab-btn" data-tab="pl">📄 損益</button>
  </nav>

  <main>
    <!-- ── TAB: 數據分析 ──────────────────────────────── -->
    <section id="tab-analytics" class="tab-panel active">

<script>
// ════════════════════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════════════════════
const PW_KEY = 'hk_pw_hash';
const FB_CONFIG_KEY = 'hk_fb_config';
const ANT_KEY_STORAGE = 'hk_ant_key';
const DATA_KEY = 'hk_data_local';

const INCOME_CATS = ['實體店面','網路訂單','市集/展覽','百貨通路','其他收入'];
const EXPENSE_CATS = ['原物料/食材','包材','薪資/人事','租金/水電','行銷費用','公關費用','裝潢工程','出國參展-機票','出國參展-住宿','國際空運','百貨抽成','員工福利','營業費用','稅費','雜支'];
const BENEFIT_SUBS = ['餐食','聚餐','年節送禮','獎金','勞健保補貼費用'];

const CAT_GROUPS = {
  '銷貨成本': ['原物料/食材','包材'],
  '人事費用': ['薪資/人事'],
  '固定開銷': ['租金/水電'],
  '行銷與公關': ['行銷費用','公關費用'],
  '資本支出': ['裝潢工程'],
  '參展與物流': ['出國參展-機票','出國參展-住宿','國際空運','百貨抽成'],
  '員工福利': ['員工福利'],
  '營業費用': ['營業費用'],
  '稅費': ['稅費'],
  '雜支': ['雜支']
};
const DETAIL_CATS = ['原物料/食材','包材'];
const MAT_UNITS = ['g','kg','ml','L','顆','個','包','罐','瓶','張','件','組'];

const GREEN_PALETTE = ['#5A9B30','#7BB94A','#9DD46A','#C0E496','#D4E9A0'];
const EXPENSE_PALETTE = ['#D94133','#1A4F9E','#C49A2A','#6C5CE7','#E05A10','#3A9B8A','#9B3A8A','#9B6A3A','#3A3A9B','#6A9B3A','#D94133','#9B9690','#4A4A4A'];

// Chart instances
let charts = {};
let activeAnalyticsSub = 'daily';

// ════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════
let db = null, unsubscribe = null;
let appData = { items: [], updatedAt: '' };
let manualType = 'income';
let saveTimer = null;
let posResults = [];
let manSubItems = [];  // sub-items for current manual entry

// ════════════════════════════════════════════════════════
// PASSWORD SYSTEM
// ════════════════════════════════════════════════════════
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function togglePw(id, btn) {
  const el = document.getElementById(id);
  if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
  else { el.type = 'password'; btn.textContent = '👁'; }
}

async function initLock() {
  const stored = localStorage.getItem(PW_KEY);
  if (!stored) {
    document.getElementById('setPwView').classList.remove('hidden');
    document.getElementById('loginView').classList.add('hidden');
  } else {
    document.getElementById('setPwView').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('loginPw').focus();
  }
}

async function doSetPassword() {
  const p1 = document.getElementById('newPw1').value;
  const p2 = document.getElementById('newPw2').value;
  const err = document.getElementById('setPwErr');
  if (p1.length < 4) { err.textContent = '密碼至少需要 4 位'; return; }
  if (p1 !== p2) { err.textContent = '兩次輸入不相符'; return; }
  localStorage.setItem(PW_KEY, await sha256(p1));
  err.textContent = '';
  unlock();
}

async function doLogin() {
  const pw = document.getElementById('loginPw').value;
  const err = document.getElementById('loginErr');
  if (!pw) { err.textContent = '請輸入密碼'; return; }
  const hash = await sha256(pw);
  if (hash === localStorage.getItem(PW_KEY)) {
    err.textContent = '';
    unlock();
  } else {
    err.textContent = '密碼錯誤，請再試一次';
    document.getElementById('loginPw').select();
  }
}

async function doChangePw() {
  const oldPw = document.getElementById('chgOldPw').value;
  const newPw1 = document.getElementById('chgNewPw1').value;
  const newPw2 = document.getElementById('chgNewPw2').value;
  const err = document.getElementById('chgPwErr');
  if (await sha256(oldPw) !== localStorage.getItem(PW_KEY)) { err.textContent = '目前密碼錯誤'; return; }
  if (newPw1.length < 4) { err.textContent = '新密碼至少需要 4 位'; return; }
  if (newPw1 !== newPw2) { err.textContent = '新密碼兩次輸入不相符'; return; }
  localStorage.setItem(PW_KEY, await sha256(newPw1));
  ['chgOldPw','chgNewPw1','chgNewPw2'].forEach(id => document.getElementById(id).value = '');
  err.textContent = '';
  toast('密碼已更新 ✓', 'success');
}

function unlock() {
  document.getElementById('lockScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  initApp();
}

function lockApp() {
  if (!confirm('確定要鎖定帳本？')) return;
  if (unsubscribe) unsubscribe();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('lockScreen').classList.remove('hidden');
  document.getElementById('loginPw').value = '';
  document.getElementById('loginErr').textContent = '';
}

// ════════════════════════════════════════════════════════
// FIREBASE
// ════════════════════════════════════════════════════════
function getFirebaseConfig() {
  const stored = localStorage.getItem(FB_CONFIG_KEY);
  if (stored) return JSON.parse(stored);
  return { apiKey:'', authDomain:'half-kitchen.firebaseapp.com', projectId:'half-kitchen' };
}

function initFirebase() {
  const cfg = getFirebaseConfig();
  if (!cfg.apiKey || !cfg.projectId) {
    setSyncStatus('offline');
    loadLocal();
    return;
  }
  try {
    // Safe init: reuse existing app if already initialized
    const app = firebase.apps.length === 0
      ? firebase.initializeApp(cfg)
      : firebase.app();
    db = firebase.firestore(app);
    setSyncStatus('saving');
    startSync();
  } catch(e) {
    console.error('Firebase init error:', e);
    setSyncStatus('error');
    loadLocal();
    toast('Firebase 連線失敗：' + e.message, 'error');
  }
}

function startSync() {
  if (!db) return;
  if (unsubscribe) unsubscribe();
  const ref = db.collection('pos').doc('accounting_data');
  setSyncStatus('saving');
  unsubscribe = ref.onSnapshot(snap => {
    if (snap.exists) {
      const remote = snap.data();
      const localItems = (appData.items || []).length;
      const remoteItems = (remote.items || []).length;
      // Take whichever has more items
      if (remoteItems >= localItems) {
        appData = remote;
        saveLocal();
      }
    }
    setSyncStatus('synced');
    refreshAllViews();
  }, err => {
    console.error('Firestore error', err);
    setSyncStatus('error');
  });
}

async function saveToFirestore() {
  if (!db) { saveLocal(); return; }
  setSyncStatus('saving');
  try {
    appData.updatedAt = new Date().toISOString();
    await db.collection('pos').doc('accounting_data').set(appData);
    saveLocal();
    setSyncStatus('synced');
  } catch(e) {
    console.error('Save error', e);
    setSyncStatus('error');
    saveLocal();
  }
}

function debounceSave() {
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveToFirestore(), 800);
}

function saveLocal() {
  localStorage.setItem(DATA_KEY, JSON.stringify(appData));
}

function loadLocal() {
  const stored = localStorage.getItem(DATA_KEY);
  if (stored) {
    try { appData = JSON.parse(stored); } catch(e) {}
  }
  refreshAllViews();
}

function setSyncStatus(status) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot ' + (status === 'synced' ? '' : status);
  dot.title = { synced:'已同步', saving:'儲存中...', error:'同步失敗', offline:'離線模式' }[status] || '';
}

function initQuickDates() {

    btn.className = 'quick-btn';
    btn.textContent = label;
    btn.onclick = () => {
      document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyQuickDate(label);
    };
    container.appendChild(btn);
  });

function applyQuickDate(label) {
  const today = new Date();
  let start, end;
  if (label === '今天') { start = end = today; }
  else if (label === '昨天') { const d = new Date(today); d.setDate(d.getDate()-1); start = end = d; }
  else if (label === '本週') {
    const d = new Date(today);
    const day = d.getDay() || 7;
    d.setDate(d.getDate() - day + 1);
    start = d; end = today;
  }
  else if (label === '本月') { start = new Date(today.getFullYear(), today.getMonth(), 1); end = today; }
  else if (label === '上個月') {
    start = new Date(today.getFullYear(), today.getMonth()-1, 1);
    end = new Date(today.getFullYear(), today.getMonth(), 0);
  }
  document.getElementById('posStart').value = dateStr(start);
  document.getElementById('posEnd').value = dateStr(end);
}

function initYearSelects() {
  const currentYear = new Date().getFullYear();
  const years = [];
  for (let y = currentYear; y >= 2024; y--) years.push(y);
  ['an-year','an-year-m','fYear','pl-year'].forEach(id => {
    const el = document.getElementById(id);

  }
}

function getItems() { return appData.items || []; }

function addItem(item) {
  if (!appData.items) appData.items = [];
  item.id = Date.now() + Math.random();
  appData.items.push(item);
  debounceSave();
}

function deleteItem(id) {
  appData.items = (appData.items || []).filter(i => i.id != id);
  debounceSave();
  renderLedger();
}

function updateItem(id, updates) {
  const idx = appData.items.findIndex(i => i.id == id);
  if (idx === -1) return;
  appData.items[idx] = { ...appData.items[idx], ...updates };
  debounceSave();
}

function filterItems({ year, month, type, cat }) {
  return getItems().filter(item => {
    if (year && !item.date.startsWith(year)) return false;
    if (month && item.date.slice(5,7) !== month) return false;
    if (type && item.type !== type) return false;
    if (cat && item.cat !== cat) return false;
    return true;
  });
}

function fmtAmt(n) { return Number(n).toLocaleString('zh-TW'); }
function todayStr() { return dateStr(new Date()); }
function dateStr(d) { return d.toISOString().slice(0,10); }

// ANALYTICS – DAILY
// ════════════════════════════════════════════════════════
function renderAnalytics() {
  if (activeAnalyticsSub !== 'daily') return;
  const year = document.getElementById('an-year').value;
  const month = document.getElementById('an-month').value;
  const items = filterItems({ year, month });

  // Stats
  const income = items.filter(i=>i.type==='income').reduce((s,i)=>s+Number(i.amount),0);
  const expense = items.filter(i=>i.type==='expense').reduce((s,i)=>s+Number(i.amount),0);
  const surplus = income - expense;
  const statsEl = document.getElementById('an-stats');
  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-label">收入</div><div class="stat-val income">${fmtAmt(income)}</div></div>
    <div class="stat-card"><div class="stat-label">支出</div><div class="stat-val expense">${fmtAmt(expense)}</div></div>
    <div class="stat-card"><div class="stat-label">盈餘</div><div class="stat-val surplus ${surplus<0?'neg':''}">${fmtAmt(surplus)}</div></div>
  `;

  // Daily bar chart
  const daysInMonth = new Date(year, month, 0).getDate();
  const dayLabels = [], incomeData = [], expenseData = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const dayStr = `${year}-${month}-${String(d).padStart(2,'0')}`;
    dayLabels.push(d);
    const dayItems = items.filter(i => i.date === dayStr);
    incomeData.push(dayItems.filter(i=>i.type==='income').reduce((s,i)=>s+Number(i.amount),0));
    expenseData.push(dayItems.filter(i=>i.type==='expense').reduce((s,i)=>s+Number(i.amount),0));
  }
  createBarChart('chartDaily', dayLabels, incomeData, expenseData);

  // Donut charts
  const incomeBycat = {}, expByCat = {};
  items.filter(i=>i.type==='income').forEach(i => incomeBycat[i.cat] = (incomeBycat[i.cat]||0)+Number(i.amount));
  items.filter(i=>i.type==='expense').forEach(i => expByCat[i.cat] = (expByCat[i.cat]||0)+Number(i.amount));
  createDonut('chartIncomeDonut', incomeBycat, GREEN_PALETTE);
  createDonut('chartExpenseDonut', expByCat, EXPENSE_PALETTE);

  // Table
  const rows = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const dayStr = `${year}-${month}-${String(d).padStart(2,'0')}`;
    const inc = incomeData[d-1], exp = expenseData[d-1];
    if (inc || exp) {
      rows.push(`<tr>
        <td>${month}/${String(d).padStart(2,'0')}</td>
        <td class="td-income">${inc?fmtAmt(inc):'-'}</td>
        <td class="td-expense">${exp?fmtAmt(exp):'-'}</td>
        <td class="td-surplus ${inc-exp<0?'neg':''}">${fmtAmt(inc-exp)}</td>
      </tr>`);
    }
  }
  document.getElementById('an-daily-table').innerHTML = rows.length ?
    `<table><thead><tr><th>日期</th><th>收入</th><th>支出</th><th>盈餘</th></tr></thead><tbody>${rows.join('')}</tbody></table>` :
    '<div class="empty"><div class="empty-icon">📭</div>本期無資料</div>';
}

function renderMonthly() {
  const year = document.getElementById('an-year-m').value;
  const items = filterItems({ year });
  const monthLabels = [], incomeData = [], expenseData = [];
  for (let m = 1; m <= 12; m++) {
    const ms = String(m).padStart(2,'0');
    const mi = items.filter(i => i.date.slice(5,7) === ms);
    monthLabels.push(m+'月');
    incomeData.push(mi.filter(i=>i.type==='income').reduce((s,i)=>s+Number(i.amount),0));
    expenseData.push(mi.filter(i=>i.type==='expense').reduce((s,i)=>s+Number(i.amount),0));
  }
  createBarChart('chartMonthly', monthLabels, incomeData, expenseData);

  const incomeBycat = {}, expByCat = {};
  items.filter(i=>i.type==='income').forEach(i => incomeBycat[i.cat] = (incomeBycat[i.cat]||0)+Number(i.amount));
  items.filter(i=>i.type==='expense').forEach(i => expByCat[i.cat] = (expByCat[i.cat]||0)+Number(i.amount));
  createDonut('chartIncomeDonutM', incomeBycat, GREEN_PALETTE);
  createDonut('chartExpenseDonutM', expByCat, EXPENSE_PALETTE);

      <td class="td-expense">${fmtAmt(exp)}</td>
      <td class="td-surplus ${sur<0?'neg':''}">${fmtAmt(sur)}</td>
      <td style="color:var(--ink3)">${margin}%</td>
    </tr>`;
  }).filter((_,i) => incomeData[i] || expenseData[i]);

  document.getElementById('an-monthly-table').innerHTML = rows.length ?
    `<table><thead><tr><th>月份</th><th>收入</th><th>支出</th><th>盈餘</th><th>盈餘率</th></tr></thead><tbody>${rows.join('')}</tbody></table>` :
    '<div class="empty"><div class="empty-icon">📭</div>本年度無資料</div>';
}

// ════════════════════════════════════════════════════════
// POS SYNC
// ════════════════════════════════════════════════════════
async function fetchPos() {
  if (!db) { toast('請先在設定中填入 Firebase 設定', 'error'); return; }
  const start = document.getElementById('posStart').value;
  const end = document.getElementById('posEnd').value;
  if (!start || !end) { toast('請選擇日期範圍', 'error'); return; }

  const btn = document.getElementById('posFetchBtn');
  btn.textContent = '讀取中...'; btn.disabled = true;
  posResults = [];

  try {
    // Collect all months in range
    const startD = new Date(start), endD = new Date(end);
    const months = [];
    let cur = new Date(startD.getFullYear(), startD.getMonth(), 1);
    while (cur <= endD) {
      const y = cur.getFullYear();
      const m = String(cur.getMonth()+1).padStart(2,'0');
      months.push(y + m);
      cur.setMonth(cur.getMonth()+1);
    }

    // Fetch each month's doc — try multiple Firestore data structures
    const dayMap = {};

    function parseTimestamp(ts) {
      if (!ts) return null;
      if (typeof ts === 'string') return ts.slice(0, 10);
      if (ts.toDate) return ts.toDate().toISOString().slice(0, 10);
      if (ts.seconds) return new Date(ts.seconds * 1000).toISOString().slice(0, 10);
      return null;
    }

    function mergeDay(dateKey, total, orderCount) {
      if (!dateKey || dateKey < start || dateKey > end) return;
      if (!dayMap[dateKey]) dayMap[dateKey] = { orders: 0, total: 0 };
      dayMap[dateKey].total += Number(total) || 0;
      dayMap[dateKey].orders += Number(orderCount) || 1;
    }

    for (const ym of months) {
      try {
        const docRef = db.collection('pos').doc('sales_' + ym);
        const snap = await docRef.get();

        if (snap.exists) {
          const docData = snap.data();
          console.log('[POS] sales_' + ym + ' fields:', Object.keys(docData));

          // Structure A: array field (orders / records / days / data / items / sales)
          // POS structure confirmed: field "items" contains array of orders
          // Each order: { total, ts (ISO string), id, discount, custType, items[] }
          const arrField = docData.items || docData.orders || docData.records || docData.days
                        || docData.data || docData.sales || docData.transactions;
          if (Array.isArray(arrField) && arrField.length > 0) {
            arrField.forEach(entry => {
              const dk = entry.date || parseTimestamp(entry.ts) || parseTimestamp(entry.timestamp) || parseTimestamp(entry.createdAt);
              mergeDay(dk, entry.total || entry.amount || entry.revenue, 1);
            });
          } else {
            // Structure B: date-keyed fields { "2026-05-01": {total, count}, ... }
            // or { "20260501": {total}, ... }
            let foundDateKeys = false;
            Object.entries(docData).forEach(([key, val]) => {
              if (typeof val !== 'object' || !val || Array.isArray(val)) return;
              // Detect date key patterns: YYYY-MM-DD or YYYYMMDD or MM/DD
              const isDateKey = /^\d{4}-\d{2}-\d{2}$/.test(key) || /^\d{8}$/.test(key);
              if (!isDateKey) return;
              foundDateKeys = true;
              const dk = /^\d{8}$/.test(key)
                ? `${key.slice(0,4)}-${key.slice(4,6)}-${key.slice(6,8)}`
                : key;
              mergeDay(dk, val.total || val.revenue || val.amount, val.count || val.orders || val.orderCount || 1);
            });

            // Structure C: direct fields ts, total, items on the doc itself (single-order doc)
            if (!foundDateKeys && (docData.ts || docData.total)) {
              const dk = parseTimestamp(docData.ts) || parseTimestamp(docData.date);
              mergeDay(dk, docData.total || docData.amount, 1);
            }
          }
        }

        // Structure D: sub-collection "orders" or "records" under sales_YYYYMM
        const subColNames = ['orders', 'records', 'transactions', 'sales'];
        for (const colName of subColNames) {
          try {
            const subSnap = await docRef.collection(colName).get();
            if (!subSnap.empty) {
              console.log('[POS] Found sub-collection:', colName, 'with', subSnap.size, 'docs');
              subSnap.forEach(d => {
                const entry = d.data();
                const dk = entry.date || parseTimestamp(entry.ts) || parseTimestamp(entry.timestamp)
                         || parseTimestamp(entry.createdAt) || parseTimestamp(entry.date);
                mergeDay(dk, entry.total || entry.amount || entry.revenue, 1);
              });
              break; // found, no need to try others
            }
          } catch(subErr) { /* sub-collection may not exist */ }
        }

      } catch(e) { console.warn('[POS] Month fetch error', ym, e.message); }
    }

    console.log('[POS] dayMap result:', dayMap);

    posResults = Object.entries(dayMap).sort((a,b) => a[0].localeCompare(b[0])).map(([date, info]) => ({
      date, total: info.total, orders: info.orders, desc: `POS 銷售 ${info.orders} 筆`
    }));

    renderPosPreview();
  } catch(e) {
    toast('讀取失敗：' + e.message, 'error');
    console.error(e);
  } finally {
    btn.textContent = '拉取 POS 資料'; btn.disabled = false;
  }
}

function renderPosPreview() {
  const card = document.getElementById('posPreviewCard');
  const list = document.getElementById('posPreviewList');
  if (!posResults.length) { toast('查無此期間資料', 'error'); card.classList.add('hidden'); return; }
  const existing = new Set(getItems().filter(i=>i.posSync).map(i=>i.date));
  list.innerHTML = posResults.map((r,i) => {
    const done = existing.has(r.date);
    return `<div class="pos-row">
      <input type="checkbox" class="pos-check" id="pos-chk-${i}" ${done?'disabled':''} ${!done?'checked':''}>
      <span class="pos-date">${r.date}</span>
      <span class="pos-desc">${r.desc}</span>
      <span class="pos-amt">$${fmtAmt(r.total)}</span>
      ${done ? '<span class="pos-tag done">已匯入</span>' : ''}
    </div>`;
  }).join('');
  card.classList.remove('hidden');
}

// ════════════════════════════════════════════════════════
// POS DIAGNOSTICS
// ════════════════════════════════════════════════════════
async function diagnosePOS() {
  if (!db) { toast('Firebase 尚未連線，請先儲存設定並重新整理頁面', 'error'); return; }
  const ym = new Date().toISOString().slice(0,7).replace('-',''); // e.g. "202605"
  const docId = 'sales_' + ym;
  let report = `=== POS 診斷報告 ===\n月份文件: pos/${docId}\n\n`;
  try {
    const docRef = db.collection('pos').doc(docId);
    const snap = await docRef.get();
    if (!snap.exists) {
      report += '❌ 文件不存在\n';
      // Try listing other docs
      try {
        const colSnap = await db.collection('pos').limit(10).get();
        report += `\npos collection 現有文件：\n`;
        colSnap.forEach(d => { report += `  - ${d.id}\n`; });
      } catch(e) { report += '無法列出 collection: ' + e.message; }
    } else {
      const data = snap.data();
      report += `✅ 文件存在\n欄位：${Object.keys(data).join(', ')}\n`;
      Object.entries(data).forEach(([k,v]) => {
        const type = Array.isArray(v) ? `Array(${v.length})` : typeof v;
        report += `  ${k}: ${type}\n`;
        if (Array.isArray(v) && v.length > 0) {
          report += `    第一筆: ${JSON.stringify(v[0]).slice(0,120)}\n`;
        }
      });
    }
    // Check sub-collections
    for (const col of ['orders','records','transactions','sales']) {
      try {
        const sub = await docRef.collection(col).limit(1).get();
        if (!sub.empty) {
          report += `\n✅ Sub-collection "${col}" 存在 (${sub.size} 筆)\n`;
          report += `  Sample: ${JSON.stringify(sub.docs[0].data()).slice(0,200)}\n`;
        }
      } catch(e) {}
    }
  } catch(e) {
    report += '❌ 讀取失敗: ' + e.message;
  }
  console.log(report);
  alert(report);
}

function setType(type) {
  manualType = type;
  document.getElementById('typeIncome').classList.toggle('active', type==='income');
  document.getElementById('typeExpense').classList.toggle('active', type==='expense');
  populateCatSelect('manCat', type);

function onCatChange() {
  const cat = document.getElementById('manCat').value;
  const isDetail = DETAIL_CATS.includes(cat);
  document.getElementById('ingWrap').classList.toggle('hidden', !isDetail);
  document.getElementById('benefitSubWrap').classList.toggle('hidden', cat !== '員工福利');
  if (isDetail) { manSubItems = []; renderSubItemsUI(); }
}

function calcIngAmt() {} // replaced by sub-items system

function doManualAdd() {
  const date = document.getElementById('manDate').value;
  const amount = Number(document.getElementById('manAmount').value);
  const cat = document.getElementById('manCat').value;
  const desc = document.getElementById('manDesc').value.trim();
  const note = document.getElementById('manNote').value.trim();

  if (!date) { toast('請選擇日期', 'error'); return; }
  if (!amount || amount <= 0) { toast('請輸入有效金額', 'error'); return; }
  if (!cat) { toast('請選擇科目', 'error'); return; }

  const item = { type: manualType, cat, date, desc, amount, note };

  if (DETAIL_CATS.includes(cat) && manSubItems.length) {
    item.subItems = [...manSubItems];
  }

  if (cat === '員工福利') {
    item.benefitSub = document.getElementById('manBenefitSub').value;
  }

  addItem(item);
  toast('記錄已新增 ✓', 'success');
  manSubItems = [];
  renderSubItemsUI();
  ['manAmount','manDesc','manNote'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  renderLedger();
}

// ════════════════════════════════════════════════════════
// LEDGER
// ════════════════════════════════════════════════════════
let editingId = null;

function renderLedger() {
  const year = document.getElementById('fYear').value;
  const month = document.getElementById('fMonth').value;
  const type = document.getElementById('fType').value;
  const cat = document.getElementById('fCat').value;
  const items = filterItems({ year, month, type, cat })
    .sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);

  // Summary
  const income = items.filter(i=>i.type==='income').reduce((s,i)=>s+Number(i.amount),0);
  const expense = items.filter(i=>i.type==='expense').reduce((s,i)=>s+Number(i.amount),0);
  const surplus = income-expense;
  document.getElementById('ledgerSummary').innerHTML = `
    <div class="stat-card"><div class="stat-label">收入</div><div class="stat-val income">${fmtAmt(income)}</div></div>
    <div class="stat-card"><div class="stat-label">支出</div><div class="stat-val expense">${fmtAmt(expense)}</div></div>
    <div class="stat-card"><div class="stat-label">盈餘</div><div class="stat-val surplus ${surplus<0?'neg':''}">${fmtAmt(surplus)}</div></div>
  `;

  if (!items.length) {
    document.getElementById('ledgerTable').innerHTML = '<div class="empty"><div class="empty-icon">📭</div>無符合記錄</div>';
    return;
  }

  const rows = items.map(item => {
    const isEditing = editingId == item.id;
    const badge = item.posSync ? '<span class="badge badge-pos">POS</span> ' : '';
    return `<tr>
      <td>${item.date}</td>
      <td><span class="badge ${item.type==='income'?'badge-sync':'badge-pos'}">${item.type==='income'?'收入':'支出'}</span></td>
      <td>${item.cat}${item.benefitSub ? ' · <small style="color:var(--ink3)">'+item.benefitSub+'</small>' : ''}</td>
      <td>${badge}${item.desc || ''}</td>
      <td class="${item.type==='income'?'td-income':'td-expense'}">${fmtAmt(item.amount)}</td>
      <td class="td-actions">
        <button class="icon-btn" onclick="toggleEdit(${item.id})" title="編輯">✏️</button>
        <button class="icon-btn del" onclick="confirmDelete(${item.id})" title="刪除">🗑</button>
      </td>
    </tr>
    ${isEditing ? renderEditRow(item) : ''}`;
  }).join('');

  document.getElementById('ledgerTable').innerHTML =
    `<table><thead><tr><th>日期</th><th>類型</th><th>科目</th><th>說明</th><th>金額</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderEditRow(item) {
  const catOpts = (item.type==='income' ? INCOME_CATS : EXPENSE_CATS)
    .map(c => `<option value="${c}" ${c===item.cat?'selected':''}>${c}</option>`).join('');
  return `<tr class="edit-row"><td colspan="6">
    <div class="edit-row-grid">
      <div class="form-group"><label class="form-label">日期</label>
        <input type="date" class="form-input" id="ed-date" value="${item.date}"></div>
      <div class="form-group"><label class="form-label">金額</label>
        <input type="number" class="form-input" id="ed-amt" value="${item.amount}"></div>
      <div class="form-group"><label class="form-label">科目</label>
        <select class="form-select" id="ed-cat">${catOpts}</select></div>
      <div class="form-group"><label class="form-label">說明</label>
        <input type="text" class="form-input" id="ed-desc" value="${item.desc||''}"></div>
      <div class="form-group"><label class="form-label">備註</label>
        <input type="text" class="form-input" id="ed-note" value="${item.note||''}"></div>
    </div>
    <div style="display:flex;gap:8px;padding:0 0 8px">
      <button class="btn btn-green btn-sm" onclick="saveEdit(${item.id})">儲存</button>
      <button class="btn btn-ghost btn-sm" onclick="cancelEdit()">取消</button>
    </div>
  </td></tr>`;
}

function toggleEdit(id) {
  editingId = editingId == id ? null : id;
  renderLedger();
}

function cancelEdit() { editingId = null; renderLedger(); }

function saveEdit(id) {
  const updates = {
    date: document.getElementById('ed-date').value,
    amount: Number(document.getElementById('ed-amt').value),
    cat: document.getElementById('ed-cat').value,
    desc: document.getElementById('ed-desc').value,
    note: document.getElementById('ed-note').value
  };
  const catType = INCOME_CATS.includes(updates.cat) ? 'income' : 'expense';
  updates.type = catType;
  updateItem(id, updates);
  editingId = null;
  toast('已儲存 ✓', 'success');
  renderLedger();
  renderAnalytics();
}

function confirmDelete(id) {
  if (!confirm('確定要刪除這筆記錄？')) return;
  deleteItem(id);
  toast('已刪除', 'success');
  renderLedger();
}

// ════════════════════════════════════════════════════════
// P&L
// ════════════════════════════════════════════════════════
function renderPL() {
  const year = document.getElementById('pl-year').value;
  const month = document.getElementById('pl-month').value;
  const items = filterItems({ year, month });

  const income = INCOME_CATS.reduce((acc, cat) => {
    acc[cat] = items.filter(i=>i.type==='income'&&i.cat===cat).reduce((s,i)=>s+Number(i.amount),0);
    return acc;
  }, {});
  const totalIncome = Object.values(income).reduce((s,v)=>s+v,0);

  const expense = EXPENSE_CATS.reduce((acc, cat) => {
    acc[cat] = items.filter(i=>i.type==='expense'&&i.cat===cat).reduce((s,i)=>s+Number(i.amount),0);
    return acc;
  }, {});
  const totalExpense = Object.values(expense).reduce((s,v)=>s+v,0);
  const surplus = totalIncome - totalExpense;
  const margin = totalIncome > 0 ? Math.round(surplus/totalIncome*100) : 0;

  // Benefit subs
  const benefitItems = items.filter(i=>i.cat==='員工福利');
  const benefitBySub = BENEFIT_SUBS.reduce((acc,s) => {
    acc[s] = benefitItems.filter(i=>i.benefitSub===s).reduce((sum,i)=>sum+Number(i.amount),0);
    return acc;
  }, {});

  let html = '';

  // INCOME
  html += `<div class="pl-section">
    <div class="pl-row" style="background:var(--paper)"><span class="pl-label group">▍ 收入</span><span class="pl-amt td-income">${fmtAmt(totalIncome)}</span></div>`;
  INCOME_CATS.forEach(cat => {
    if (income[cat]) html += `<div class="pl-row"><span class="pl-label sub">${cat}</span><span class="pl-amt td-income">${fmtAmt(income[cat])}</span></div>`;
  });
  html += '</div>';

  // EXPENSE groups
  html += `<div class="pl-section">
    <div class="pl-row" style="background:var(--paper)"><span class="pl-label group">▍ 支出</span><span class="pl-amt td-expense">${fmtAmt(totalExpense)}</span></div>`;
  Object.entries(CAT_GROUPS).forEach(([group, cats]) => {
    const groupTotal = cats.reduce((s,c) => s + (expense[c]||0), 0);
    if (!groupTotal) return;
    html += `<div class="pl-row" style="background:var(--cream)"><span class="pl-label" style="font-weight:500">${group}</span><span class="pl-amt">${fmtAmt(groupTotal)}</span></div>`;
    cats.forEach(cat => {
      if (!expense[cat]) return;
      html += `<div class="pl-row"><span class="pl-label sub">${cat}</span><span class="pl-amt td-expense">${fmtAmt(expense[cat])}</span></div>`;
      if (cat === '員工福利') {
        BENEFIT_SUBS.forEach(sub => {
          if (benefitBySub[sub]) html += `<div class="pl-row"><span class="pl-label sub" style="padding-left:28px">· ${sub}</span><span class="pl-amt" style="color:var(--ink3)">${fmtAmt(benefitBySub[sub])}</span></div>`;
        });
      }
    });
  });
  html += '</div>';

  // SURPLUS
  html += `<div class="pl-row total">
    <span class="pl-label">本期盈餘 (${margin}%)</span>
    <span class="pl-amt ${surplus<0?'neg':''}">${fmtAmt(surplus)}</span>
  </div>`;

  document.getElementById('plContent').innerHTML = html;
}

// ════════════════════════════════════════════════════════
// CSV / EXCEL EXPORT (重構版)
// ════════════════════════════════════════════════════════
function exportExcel() {
  const year = document.getElementById('pl-year').value;
  const month = document.getElementById('pl-month').value;
  const allItems = filterItems({ year, month });
  const wb = XLSX.utils.book_new();

  const months = month
    ? [month]
    : ['01','02','03','04','05','06','07','08','09','10','11','12'];

  // ── Sheet 1: 收支總表 ────────────────────────────────────
  const summaryHeader = [
    '月份','銷貨收入','食材成本','包材成本','銷貨毛利',
    '薪資/人事','租金/水電','行銷費用','公關費用','裝潢工程',
    '出國參展-機票','出國參展-住宿','國際空運','百貨抽成',
    '員工福利','營業費用','稅費','雜支',
    '總支出','淨利','毛利率'
  ];
  const summaryRows = [summaryHeader];
  months.forEach(m => {
    const mi = allItems.filter(i => i.date.slice(5,7) === m);
    const totalInc = mi.filter(i=>i.type==='income').reduce((s,i)=>s+Number(i.amount),0);
    if (!totalInc && !mi.filter(i=>i.type==='expense').length) return;
    const getExp = cat => mi.filter(i=>i.type==='expense'&&i.cat===cat).reduce((s,i)=>s+Number(i.amount),0);
    const foodCost  = getExp('原物料/食材');
    const packCost  = getExp('包材');
    const grossProfit = totalInc - foodCost - packCost;
    const salary    = getExp('薪資/人事');
    const rent      = getExp('租金/水電');
    const marketing = getExp('行銷費用');
    const pr        = getExp('公關費用');
    const renovation= getExp('裝潢工程');
    const airTicket = getExp('出國參展-機票');
    const hotel     = getExp('出國參展-住宿');
    const freight   = getExp('國際空運');
    const commission= getExp('百貨抽成');
    const welfare   = getExp('員工福利');
    const opex      = getExp('營業費用');
    const tax       = getExp('稅費');
    const misc      = getExp('雜支');
    const totalExp  = mi.filter(i=>i.type==='expense').reduce((s,i)=>s+Number(i.amount),0);
    const netProfit = totalInc - totalExp;
    const margin    = totalInc > 0 ? (netProfit/totalInc*100).toFixed(1)+'%' : '0%';
    summaryRows.push([
      parseInt(m)+'月', totalInc, foodCost, packCost, grossProfit,
      salary, rent, marketing, pr, renovation,
      airTicket, hotel, freight, commission,
      welfare, opex, tax, misc,
      totalExp, netProfit, margin
    ]);
  });
  // Add total row
  if (summaryRows.length > 1) {
    const dataRows = summaryRows.slice(1);
    const totals = ['合計'];
    for (let c = 1; c < summaryHeader.length - 1; c++) {
      totals.push(dataRows.reduce((s,r) => s + (typeof r[c]==='number'?r[c]:0), 0));
    }
    const totalInc = totals[1];
    const totalNet = totals[19];
    totals.push(totalInc > 0 ? (totalNet/totalInc*100).toFixed(1)+'%' : '0%');
    summaryRows.push(totals);
  }
  const ws1 = XLSX.utils.aoa_to_sheet(summaryRows);
  ws1['!cols'] = summaryHeader.map((h,i) => ({ wch: i===0 ? 6 : 10 }));
  XLSX.utils.book_append_sheet(wb, ws1, '收支總表');

  // ── Sheets 2+: 每月細項 ──────────────────────────────────
  months.forEach(m => {
    const mi = allItems.filter(i => i.date.slice(5,7) === m);
    if (!mi.length) return;
    const year4 = year;
    const daysInMonth = new Date(parseInt(year4), parseInt(m), 0).getDate();
    const monthHeader = ['日期','收入','食材成本','包材成本','銷貨毛利','薪資/人事','行銷/公關','員工福利','營業費用','稅費','其他支出','淨利','備註'];
    const monthRows = [monthHeader];
    for (let d = 1; d <= daysInMonth; d++) {
      const dk = `${year4}-${m}-${String(d).padStart(2,'0')}`;
      const di = mi.filter(i => i.date === dk);
      if (!di.length) continue;
      const inc   = di.filter(i=>i.type==='income').reduce((s,i)=>s+Number(i.amount),0);
      const food  = di.filter(i=>i.cat==='原物料/食材').reduce((s,i)=>s+Number(i.amount),0);
      const pack  = di.filter(i=>i.cat==='包材').reduce((s,i)=>s+Number(i.amount),0);
      const gross = inc - food - pack;
      const sal   = di.filter(i=>i.cat==='薪資/人事').reduce((s,i)=>s+Number(i.amount),0);
      const mkpr  = di.filter(i=>['行銷費用','公關費用'].includes(i.cat)).reduce((s,i)=>s+Number(i.amount),0);
      const wel   = di.filter(i=>i.cat==='員工福利').reduce((s,i)=>s+Number(i.amount),0);
      const opex  = di.filter(i=>i.cat==='營業費用').reduce((s,i)=>s+Number(i.amount),0);
      const tax   = di.filter(i=>i.cat==='稅費').reduce((s,i)=>s+Number(i.amount),0);
      const other = di.filter(i=>i.type==='expense'&&!['原物料/食材','包材','薪資/人事','行銷費用','公關費用','員工福利','營業費用','稅費'].includes(i.cat)).reduce((s,i)=>s+Number(i.amount),0);
      const exp   = di.filter(i=>i.type==='expense').reduce((s,i)=>s+Number(i.amount),0);
      const net   = inc - exp;
      const notes = di.filter(i=>i.desc||i.note).map(i=>[i.desc,i.note].filter(Boolean).join(' ')).join('；');
      monthRows.push([dk, inc, food, pack, gross, sal, mkpr, wel, opex, tax, other, net, notes]);
    }
    // Monthly total row
    if (monthRows.length > 1) {
      const dr = monthRows.slice(1);
      const tot = [parseInt(m)+'月 合計'];
      for (let c = 1; c <= 11; c++) tot.push(dr.reduce((s,r)=>s+(typeof r[c]==='number'?r[c]:0),0));
      tot.push('');
      monthRows.push(tot);
    }
    const ws = XLSX.utils.aoa_to_sheet(monthRows);
    ws['!cols'] = monthHeader.map((_,i) => ({ wch: i===0 ? 11 : 10 }));
    XLSX.utils.book_append_sheet(wb, ws, parseInt(m)+'月');
  });

  // ── Sheet: 成本表 ────────────────────────────────────────
  const costCats = ['原物料/食材','包材','薪資/人事','租金/水電','行銷費用','公關費用','裝潢工程','出國參展-機票','出國參展-住宿','國際空運','百貨抽成','員工福利','營業費用','稅費','雜支'];
  const costRows = [];
  const expItems = allItems.filter(i=>i.type==='expense').sort((a,b)=>a.date.localeCompare(b.date));
  costCats.forEach(cat => {
    const catItems = expItems.filter(i=>i.cat===cat);
    if (!catItems.length) return;
    const catTotal = catItems.reduce((s,i)=>s+Number(i.amount),0);
    costRows.push([cat, '', '', '', '', '', catTotal]);
    costRows.push(['日期','說明','品名','數量','單位','單價','金額']);
    catItems.forEach(item => {
      if (item.subItems && item.subItems.length) {
        item.subItems.forEach(sub => {
          costRows.push([item.date, item.desc||'', sub.name, sub.qty, sub.unit, sub.unitPrice, sub.subtotal]);
        });
      } else {
        costRows.push([item.date, item.desc||'', item.ingName||'', item.ingQty||'', item.ingUnit||'', item.ingUnitPrice||'', item.amount]);
      }
    });
    costRows.push(['', '', '', '', '', '小計', catTotal]);
    costRows.push([]);
  });
  if (costRows.length) {
    const wsCost = XLSX.utils.aoa_to_sheet(costRows);
    wsCost['!cols'] = [11,16,12,6,6,8,10].map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, wsCost, '成本表');
  }

  const filename = `半吊子廚房_帳本_${year}${month?'_'+parseInt(month)+'月':''}.xlsx`;
  XLSX.writeFile(wb, filename);
  toast('Excel 已下載 ✓', 'success');
}

function loadFirebaseConfigToForm() {
  const cfg = getFirebaseConfig();
  document.getElementById('fbApiKey').value = cfg.apiKey || '';
  document.getElementById('fbAuthDomain').value = cfg.authDomain || 'half-kitchen.firebaseapp.com';
  document.getElementById('fbProjectId').value = cfg.projectId || 'half-kitchen';
}

function saveFirebaseConfig() {
  const cfg = {
    apiKey: document.getElementById('fbApiKey').value.trim(),
    authDomain: document.getElementById('fbAuthDomain').value.trim(),
    projectId: document.getElementById('fbProjectId').value.trim()
  };
  if (!cfg.apiKey || !cfg.projectId) { toast('請填寫完整的 Firebase 設定', 'error'); return; }
  localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg));
  // Must reload for clean Firebase initialization
  if (confirm('Firebase 設定已儲存！\n\n需要重新整理頁面才能連線，請重新輸入密碼。\n\n是否立即重新整理？')) {
    location.reload();
  } else {
    toast('請手動重新整理頁面以套用 Firebase 設定', 'success');
    closeSettings();
  }
}

function loadAnthropicKeyToForm() {
  const key = localStorage.getItem(ANT_KEY_STORAGE) || '';
  document.getElementById('anthropicKey').value = key;
}

function saveAnthropicKey() {
  const key = document.getElementById('anthropicKey').value.trim();
  localStorage.setItem(ANT_KEY_STORAGE, key);
  toast('API Key 已儲存 ✓', 'success');
}

// ════════════════════════════════════════════════════════
// BACKUP
// ════════════════════════════════════════════════════════
function exportBackup() {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `半吊子廚房_備份_${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(url);
  toast('備份已下載 ✓', 'success');
}

function importBackupPrompt() {
  document.getElementById('backupFileInput').click();
}

function doImportBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.items) throw new Error('格式不正確');
      if (!confirm(`確定要匯入 ${imported.items.length} 筆記錄？現有資料將被取代。`)) return;
      appData = imported;
      debounceSave();
      refreshAllViews();
      toast(`已匯入 ${imported.items.length} 筆記錄`, 'success');
    } catch(err) {
      toast('匯入失敗：格式不正確', 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════
let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 2500);
}

// ════════════════════════════════════════════════════════
// MATERIAL LIBRARY
// ════════════════════════════════════════════════════════
function getMaterials() { return appData.materials || []; }

function saveMaterial() {
  const id = document.getElementById('matEditId').value;
  const name = document.getElementById('matName').value.trim();
  const cat = document.getElementById('matCat').value;
  const unit = document.getElementById('matUnit').value;
  const note = document.getElementById('matNote').value.trim();
  if (!name) { toast('請輸入品名', 'error'); return; }
  if (!appData.materials) appData.materials = [];
  if (id) {
    const idx = appData.materials.findIndex(m => m.id == id);
    if (idx !== -1) appData.materials[idx] = { ...appData.materials[idx], name, cat, unit, note };
    toast('材料已更新 ✓', 'success');
  } else {
    appData.materials.push({ id: Date.now(), name, cat, unit, note });
    toast('材料已新增 ✓', 'success');
  }
  debounceSave();
  closeMatForm();
  renderMaterials();
}

function deleteMaterial(id) {
  if (!confirm('確定要刪除這個材料？')) return;
  appData.materials = (appData.materials || []).filter(m => m.id != id);
  debounceSave();
  renderMaterials();
  toast('已刪除', 'success');
}

function openMatForm(id) {
  const card = document.getElementById('matFormCard');
  card.classList.remove('hidden');
  // Populate unit select
  const unitEl = document.getElementById('matUnit');
  unitEl.innerHTML = MAT_UNITS.map(u => `<option value="${u}">${u}</option>`).join('');
  if (id) {
    const mat = getMaterials().find(m => m.id == id);
    if (!mat) return;
    document.getElementById('matFormTitle').textContent = '編輯材料';
    document.getElementById('matEditId').value = mat.id;
    document.getElementById('matName').value = mat.name;
    document.getElementById('matCat').value = mat.cat;
    unitEl.value = mat.unit;
    document.getElementById('matNote').value = mat.note || '';
  } else {
    document.getElementById('matFormTitle').textContent = '新增材料';
    document.getElementById('matEditId').value = '';
    document.getElementById('matName').value = '';
    document.getElementById('matCat').value = '原物料/食材';
    document.getElementById('matNote').value = '';
  }
  card.scrollIntoView({ behavior: 'smooth' });
}

function closeMatForm() {
  document.getElementById('matFormCard').classList.add('hidden');
}

function renderMaterials() {
  const filterCat = document.getElementById('matFilterCat').value;
  const search = (document.getElementById('matSearch').value || '').toLowerCase();
  let mats = getMaterials().filter(m => {
    if (filterCat && m.cat !== filterCat) return false;
    if (search && !m.name.toLowerCase().includes(search)) return false;
    return true;
  });
  const el = document.getElementById('matList');
  if (!mats.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📦</div>尚無材料，點右上角新增</div>';
    return;
  }
  // Group by category
  const bycat = {};
  mats.forEach(m => { if (!bycat[m.cat]) bycat[m.cat] = []; bycat[m.cat].push(m); });
  let html = '';
  Object.entries(bycat).forEach(([cat, items]) => {
    html += `<div style="margin-bottom:14px">
      <div class="section-label" style="margin-bottom:8px">${cat}</div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>品名</th><th>單位</th><th>備註</th><th></th></tr></thead>
        <tbody>${items.map(m => `<tr>
          <td><strong>${m.name}</strong></td>
          <td><span class="badge" style="background:var(--paper);color:var(--ink2)">${m.unit}</span></td>
          <td style="color:var(--ink3);font-size:12px">${m.note || ''}</td>
          <td class="td-actions">
            <button class="icon-btn" onclick="openMatForm(${m.id})" title="編輯">✏️</button>
            <button class="icon-btn del" onclick="deleteMaterial(${m.id})" title="刪除">🗑</button>
          </td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
  });
  el.innerHTML = html;
}

// ════════════════════════════════════════════════════════
// SUB-ITEMS (for 原物料/食材 and 包材)
// ════════════════════════════════════════════════════════
function populateSubMatSelect() {
  const cat = document.getElementById('manCat').value;
  const sel = document.getElementById('subMatSelect');
  const mats = getMaterials().filter(m => m.cat === cat);
  sel.innerHTML = '<option value="">-- 選擇材料（選填）--</option>' +
    mats.map(m => `<option value="${m.id}">${m.name}（${m.unit}）</option>`).join('');
  // Populate unit select
  const unitEl = document.getElementById('subUnit');
  unitEl.innerHTML = MAT_UNITS.map(u => `<option value="${u}">${u}</option>`).join('');
}

function onSubMatSelect() {
  const id = document.getElementById('subMatSelect').value;
  if (!id) return;
  const mat = getMaterials().find(m => m.id == id);
  if (!mat) return;
  document.getElementById('subName').value = mat.name;
  document.getElementById('subUnit').value = mat.unit;
  document.getElementById('subQty').focus();
}

function calcSubTotal() {
  const qty = Number(document.getElementById('subQty').value) || 0;
  const price = Number(document.getElementById('subUnitPrice').value) || 0;
  document.getElementById('subSubtotal').value = qty * price || '';
}

function openAddSubItem() {
  populateSubMatSelect();
  document.getElementById('subItemForm').classList.remove('hidden');
  ['subMatSelect','subName','subQty','subUnitPrice','subSubtotal'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  const unitEl = document.getElementById('subUnit');
  unitEl.innerHTML = MAT_UNITS.map(u => `<option value="${u}">${u}</option>`).join('');
}

function cancelAddSubItem() {
  document.getElementById('subItemForm').classList.add('hidden');
}

function confirmAddSubItem() {
  const name = document.getElementById('subName').value.trim();
  const qty = Number(document.getElementById('subQty').value) || 0;
  const unit = document.getElementById('subUnit').value;
  const unitPrice = Number(document.getElementById('subUnitPrice').value) || 0;
  const subtotal = qty * unitPrice;
  if (!name) { toast('請輸入品名', 'error'); return; }
  manSubItems.push({ name, qty, unit, unitPrice, subtotal });
  document.getElementById('subItemForm').classList.add('hidden');
  renderSubItemsUI();
  // Auto-fill total amount
  updateManAmountFromSubs();
}

function removeSubItem(idx) {
  manSubItems.splice(idx, 1);
  renderSubItemsUI();
  updateManAmountFromSubs();
}

function updateManAmountFromSubs() {
  const total = manSubItems.reduce((s, i) => s + i.subtotal, 0);
  if (total > 0) document.getElementById('manAmount').value = total;
}

function renderSubItemsUI() {
  const el = document.getElementById('subItemsList');
  const totalEl = document.getElementById('subItemTotal');
  if (!manSubItems.length) { el.innerHTML = ''; totalEl.style.display = 'none'; return; }
  const total = manSubItems.reduce((s, i) => s + i.subtotal, 0);
  el.innerHTML = `<table style="width:100%;font-size:12px;border-collapse:collapse">
    <thead><tr style="background:var(--paper)">
      <th style="padding:6px 8px;text-align:left">品名</th>
      <th style="padding:6px 8px;text-align:left">數量</th>
      <th style="padding:6px 8px;text-align:left">單位</th>
      <th style="padding:6px 8px;text-align:left">單價</th>
      <th style="padding:6px 8px;text-align:right">小計</th>
      <th style="padding:6px 8px"></th>
    </tr></thead>
    <tbody>${manSubItems.map((item,i) => `<tr style="border-top:1px solid var(--border)">
      <td style="padding:6px 8px"><strong>${item.name}</strong></td>
      <td style="padding:6px 8px">${item.qty}</td>
      <td style="padding:6px 8px">${item.unit}</td>
      <td style="padding:6px 8px">$${item.unitPrice}</td>
      <td style="padding:6px 8px;text-align:right;font-family:'Noto Serif TC',serif;color:var(--green)">$${item.subtotal.toLocaleString()}</td>
      <td style="padding:6px 8px"><button class="icon-btn del" onclick="removeSubItem(${i})" style="font-size:12px">✕</button></td>
    </tr>`).join('')}</tbody>
  </table>`;
  document.getElementById('subItemTotalAmt').textContent = '$' + total.toLocaleString('zh-TW');
  totalEl.style.display = 'block';
}
